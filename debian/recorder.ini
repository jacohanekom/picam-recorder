# /etc/picam-recorder/recorder.ini
#
# raw_port/raw_width/raw_height default from the shared
# /etc/aipicam/streams.conf (aipicam-config package) — picam-raw's wire
# protocol carries no width/height field, so this file's own copy
# previously risked silently drifting from what picam-raw actually
# sends. Uncomment below to explicitly override the shared file for
# local debugging.

raw_host   = 127.0.0.1
# raw_port   = 8560
# raw_width  = 2304
# raw_height = 1296
raw_fps    = 30
# raw_stride = 0   # 0 = same as raw_width (picam-raw always sends tightly-packed rows now, so this should never need to be set)

dir  = /var/lib/picam-recorder
port = 8080
pre  = 10
post = 10

# GET /stream?stream=main-high|main-low on this port always serves live
# MJPEG (multipart/x-mixed-replace), whether or not a recording is
# currently in progress -- picam-orchestrator-go proxies these straight
# through to its own live main view rather than re-compressing the same
# frames itself; see that project's [recorder].stream_port, which must
# match this value.
stream_port = 8081

# libjpeg-turbo's 1-100 IJG quality scale -- same scale and same defaults
# as picam-orchestrator-go's own main-high/main-low live tiers, so the
# two continuously published streams above look the same whether a
# browser is watching picam-orchestrator's proxy of them or (via "high")
# a finished recording made from the same frames.
mjpeg_quality_high = 85
mjpeg_quality_low  = 40
